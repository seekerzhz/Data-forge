<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataForge Queue</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260702-deepseek-custom-solution">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>粘贴题面，一键生成数据包</h1>
      <p class="subtitle">填写题面 Markdown 和数据组数后提交；默认由 DeepSeek 生成标准解，也可手动粘贴 Solution 覆盖。</p>
      <div class="toolbar">
        <label class="token-field" for="api-token">API Token</label>
        <input id="api-token" class="api-token" type="password" autocomplete="off" placeholder="可选；服务端启用鉴权时必填">
        <button class="button" type="button" data-action="add-item">新的题面</button>
      </div>
      <p id="auth-hint" class="subtitle" hidden></p>
    </header>
    <section id="list" class="list" aria-label="题面提交列表"></section>
  </main>

  <template id="task-card-template">
    <article class="card">
      <div class="card-header">
        <h2 class="card-title"></h2>
        <span class="status is-idle">waiting-edit</span>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar"></div>
      </div>
      <div class="card-body">
        <div class="field-row">
          <div class="field" data-field="pid">
            <label>题号</label>
            <input class="pid" placeholder="可空">
          </div>
          <div class="field" data-field="cases">
            <label>数据组数</label>
            <input class="num_cases" type="number" min="1" max="100" value="20" title="数据组数">
          </div>
        </div>
        <div class="field statement-field" data-field="markdown">
          <label>题面 Markdown</label>
          <textarea class="md statement-input" rows="10" placeholder="粘贴题面"></textarea>
        </div>
        <div class="manual-solution">
          <label class="toggle-line">
            <input class="custom-solution-toggle" type="checkbox">
            <span>粘贴自定义 Solution（确认后替代 DeepSeek 自动生成）</span>
          </label>
          <div class="field custom-solution-panel" data-field="custom-solution" hidden>
            <label>自定义 Solution / 标准代码</label>
            <textarea class="custom-solution code-input" rows="12" spellcheck="false" placeholder="粘贴 C++17 标准代码；提交后将用于编译与生成输出"></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="button submit" type="button">提交本题面</button>
          <button class="button secondary clear" type="button">清除</button>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="/static/js/app.js?v=20260715-hardening" defer></script>
</body>
</html>
